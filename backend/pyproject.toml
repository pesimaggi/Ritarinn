[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ritarinn-backend"
version = "0.1.0"
description = "Local-first Icelandic writing assistant — backend"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ritarinn contributors" }]
dependencies = [
    "reynir-correct==4.1.3",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
ritarinn-backend = "ritarinn.__main__:main"

[tool.setuptools.packages.find]
include = ["ritarinn*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
